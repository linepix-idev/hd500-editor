<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HD500 Editor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top">
  <button id="sidebarToggle" class="icon" aria-label="Toggle library" aria-expanded="true" aria-controls="librarySidebar" title="Toggle library (B)"></button>
  <div class="brand">HD500<span>Editor</span></div>
  <nav class="presetnav" aria-label="Preset">
    <button id="prev" class="icon" aria-label="Previous preset" title="Previous preset (←)"></button>
    <div class="presetname"><span id="pnum">1A</span><button id="presetName" title="Rename preset" aria-label="Rename preset"><b id="pname">—</b></button><em id="dirty" title="Unsaved changes" hidden>●</em></div>
    <button id="next" class="icon" aria-label="Next preset" title="Next preset (→)"></button>
  </nav>
  <div class="actions">
    <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button id="redo" class="icon" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
    <button id="revert" class="icon" title="Discards changes and reloads the preset stored in the pedal" aria-label="Discard" hidden></button>
    <button id="save" class="primary" title="Writes the preset to the pedal's memory (Ctrl+S)">Save to pedal</button>
    <span class="toolbar-divider"></span>
    <button id="fileMenu" class="icon" title="File" aria-label="File"></button>
    <button id="language" class="icon" title="Language" aria-label="Language"></button>
    <button id="theme" class="icon" title="Light/dark theme" aria-label="Toggle theme"></button>
    <button id="help" class="icon" title="Help and shortcuts (?)" aria-label="Help"></button>
  </div>
</header>
<div class="app-layout">
  <button id="drawerBackdrop" hidden aria-label="Close library"></button>
  <aside id="librarySidebar" aria-label="Preset library">
    <div class="sidebar-head"><h2>Library</h2><button id="libraryMore" class="icon" aria-label="Library actions" title="Library actions"></button><button id="libraryClose" class="icon" aria-label="Close library" title="Close library"></button></div>
    <label class="set-label" for="setSel">Current set</label><select id="setSel" aria-label="Set"></select>
    <label class="library-search"><span id="searchIcon"></span><input id="librarySearch" type="search" placeholder="Search all presets…" aria-label="Search all presets"></label>
    <div id="libbar" class="bar" hidden role="progressbar" aria-label="Reading preset names" aria-valuemin="0" aria-valuemax="100"><i></i></div>
    <div id="libraryList" class="library-list" aria-label="Presets"></div>
    <div class="sidebar-foot"><span>8 sets · 64 presets</span><span class="key-hint">B</span></div>
  </aside>
  <main>
    <div class="workspace-heading"><div><p class="eyebrow">Your sound, connected</p><h1>Signal chain</h1></div><button class="conn" id="conn" title="Reconnect to the pedal"><i class="dot"></i><span id="connText">connecting…</span></button></div>
    <section id="chainWrap" aria-label="Signal chain">
      <div class="canvas-toolbar"><span class="dim">Select to shape. Drag to connect.</span><div><button id="colorLegend" class="icon" title="Signal colors" aria-label="Signal colors"></button><button id="chainTrash" class="icon" title="Drag a block here to clear it" aria-label="Clear selected block"></button></div></div>
      <div class="chain-scroll"><div id="chain"><div class="chain-skeleton"></div></div></div>
      <div class="canvas-footer"><span><i class="signal-dot"></i>Live edit buffer</span><span>Changes are saved when you choose Save.</span></div>
    </section>
    <div class="split">
      <section id="inspector" aria-label="Block editor"></section>
      <aside id="side">
        <div class="tabs" role="tablist" aria-label="Preset controls" id="tabs">
          <button id="tab-setup" role="tab" data-tab="setup" aria-selected="true" aria-controls="tabBody">Inputs</button>
          <button id="tab-fs" role="tab" data-tab="fs" aria-selected="false" aria-controls="tabBody">Footswitches</button>
          <button id="tab-advanced" role="tab" data-tab="advanced" aria-selected="false" aria-controls="tabBody">Advanced</button>
        </div>
        <div id="tabBody" role="tabpanel" aria-labelledby="tab-setup"></div>
      </aside>
    </div>
    <footer class="workspace-footer"><span>POD HD500</span><span>Made for the music.</span></footer>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<div id="dragStatus" class="sr-only" role="status" aria-live="polite"></div>
<input type="file" id="filePick" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
