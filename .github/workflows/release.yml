name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, args: --linux }
          - { os: windows-latest, args: --win }
          - { os: macos-latest, args: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hd500-editor-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
