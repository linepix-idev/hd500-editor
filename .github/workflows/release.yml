name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, args: --linux }
          - { os: windows-latest, args: --win }
          - { os: macos-latest, args: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - name: Zadig (WinUSB helper bundled in the Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build/win
          curl -fsSL -o build/win/zadig.exe https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe
          echo "4ecaa95df3da3621486a043aef8b3050b8bafe7c901402871e816229ef82039b  build/win/zadig.exe" | sha256sum -c -
      - run: node node_modules/electron/install.js
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hd500-editor-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*mac*.zip
  publish:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'hd500-editor-*', path: assets, merge-multiple: true }
      - name: Draft pre-release (private until you publish it)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HD500 Editor $V" > notes.md
          printf '\nGuides (PDF) with each system'"'"'s limitations are attached: Linux, Windows, macOS, in English and Portuguese.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "HD500 Editor $V (beta)" --notes-file notes.md assets/* docs/pdf/*.pdf
